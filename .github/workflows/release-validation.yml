name: CI & npm publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development dependencies
        run: bun install --frozen-lockfile
      - name: Run regression tests
        run: bun test
      - name: Build bundles and declarations
        run: bun run build
      - name: Preview npm package
        run: npm pack --dry-run --ignore-scripts
      - name: Build npm tarball and check isolated consumers
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          export TEXTDIFFNEXT_TARBALL="$RUNNER_TEMP/$(bun -p 'const p = require("./package.json"); `${p.name}-${p.version}.tgz`')"
          test -f "$TEXTDIFFNEXT_TARBALL"
          tar -tzf "$TEXTDIFFNEXT_TARBALL"
          bun run test:consumer

  publish:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - name: Check tag matches package version
        run: bun -e 'const version = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error(`Tag must be v${version}`)'
      - run: bun run build
      - run: npm publish --access public --provenance --ignore-scripts
