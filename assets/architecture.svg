<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">textdiffnext · patch pipeline</title>
  <desc id="desc">UTF-16 code-unit coordinates end to end, with the upstream Myers, cleanup and Bitap implementations</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e5e7eb}
      .title{font-size:21px;font-weight:700;fill:#f8fafc}
      .sub{font-size:13px;fill:#9ca3af}
      .head{font-size:15px;font-weight:650;fill:#f8fafc}
      .body{font-size:12px;fill:#cbd5e1}
      .code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7dd3fc}
      .axis{font-size:11px;fill:#94a3b8}
      .val{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}
      .grp{font-size:13px;font-weight:600;fill:#f1f5f9}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1180" height="400" rx="18" fill="url(#bg)" stroke="#334155"/>
  <text x="32" y="43" class="title">textdiffnext · patch pipeline</text>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M234 187h22"/><path d="M464 187h22"/><path d="M694 187h22"/><path d="M924 187h22"/></g>
  <text x="32" y="68" class="sub">UTF-16 code-unit coordinates end to end, with the upstream Myers, cleanup and Bitap implementations</text>
    <rect x="30" y="112" width="200" height="150" rx="12" fill="#172554" stroke="#60a5fa"/>
    <text x="48" y="144" class="head">Source text</text>
    <text x="48" y="174" class="body">Text A and text B</text>
    <text x="48" y="197" class="body">JavaScript strings</text>
    <text x="48" y="220" class="body">Astral and lone surrogates</text>
    <text x="48" y="243" class="code">makeDiff · makePatches</text>
    <rect x="260" y="112" width="200" height="150" rx="12" fill="#312e81" stroke="#a78bfa"/>
    <text x="278" y="144" class="head">UTF-16 model</text>
    <text x="278" y="174" class="body">Zero-based code units</text>
    <text x="278" y="197" class="body">Same units as .length</text>
    <text x="278" y="220" class="body">No byte translation layer</text>
    <text x="278" y="243" class="code">start1 · length1</text>
    <rect x="490" y="112" width="200" height="150" rx="12" fill="#064e3b" stroke="#34d399"/>
    <text x="508" y="144" class="head">Diff</text>
    <text x="508" y="174" class="body">Myers bisect</text>
    <text x="508" y="197" class="body">Semantic cleanup pass</text>
    <text x="508" y="220" class="body">xIndex shared segment</text>
    <text x="508" y="243" class="code">upstream algorithm</text>
    <rect x="720" y="112" width="200" height="150" rx="12" fill="#713f12" stroke="#fbbf24"/>
    <text x="738" y="144" class="head">Apply</text>
    <text x="738" y="174" class="body">Bitap match at code units</text>
    <text x="738" y="197" class="body">Exact, then fuzzy</text>
    <text x="738" y="220" class="body">Flags per patch</text>
    <text x="738" y="243" class="code">[text, boolean[]]</text>
    <rect x="950" y="112" width="200" height="150" rx="12" fill="#4c1d95" stroke="#c4b5fd"/>
    <text x="968" y="144" class="head">Wire format</text>
    <text x="968" y="174" class="body">Google DMP patch text</text>
    <text x="968" y="197" class="body">@@ -s,l +s,l @@ headers</text>
    <text x="968" y="220" class="body">%uXXXX for lone surrogates</text>
    <text x="968" y="243" class="code">parsePatch · stringify</text>
  <rect x="30" y="300" width="1120" height="70" rx="10" fill="#111827" stroke="#334155"/>
  <text x="50" y="326" class="head">Contracts</text>
  <text x="50" y="348" class="body">Coordinates: UTF-16 code units, zero-based, in patch objects and patch text</text>
  <text x="50" y="368" class="body">Patch text is Google DMP format, not Unified Diff; split surrogates use %uXXXX and are not Google-compatible</text>
</svg>
